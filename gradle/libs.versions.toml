[versions]
minecraft = "26.2"
paper-api = "26.2.build.132-stable"
run-paper = "3.1.0"
fabric-loader = "0.19.5"
junit = "6.1.3"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
