name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Get the version from the tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version (expected v<major>.<minor>.<patch>, e.g. v2.0.0)"
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build with Gradle
        run: ./gradlew build -PpluginVersion="$VERSION"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version with a suffix, such as 2.0.0-beta.1, is published as a pre-release
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" "build/libs/Bingo-$VERSION.jar" \
            "build/distributions/Bingo-resourcepack-$VERSION.zip" \
            --title "Bingo $VERSION" --generate-notes --verify-tag $prerelease
