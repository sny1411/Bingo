name: Feature request
description: Suggest an idea, a new challenge or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the idea, and the problem it solves if there is one.
    validations:
      required: true
  - type: textarea
    id: challenge
    attributes:
      label: New challenge (optional)
      description: If you are suggesting a challenge, give its name, what the player must do and its difficulty (EASY, MEDIUM, HARD or EXTREME).
