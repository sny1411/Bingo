name: Bingo
version: '${version}'
main: fr.sny1411.bingo.Bingo
description: Not approved or affiliated with Mojang or Microsoft
api-version: '26.2'
permissions:
  bingo.command.new:
    description: Allows creating a new game with /bingo new
    default: op
  bingo.command.start:
    description: Allows starting the game with /bingo start
    default: op
  bingo.command.stop:
    description: Allows stopping the game before the end with /bingo stop
    default: op
  bingo.command.results:
    description: Allows showing the ranking with /bingo results
    default: op
  bingo.command.timer:
    description: Allows moving the game timer forward or speeding it up with /bingo timer
    default: op
  bingo.command.validate:
    description: Allows validating or invalidating a challenge by hand with /bingo validate and /bingo invalidate
    default: op
  bingo.command.grid:
    description: Allows choosing challenges of the grid before the game with /bingo grid
    default: op
  bingo.command.pack:
    description: Allows checking the resource pack with /bingo pack
    default: op
  bingo.settings:
    description: Allows changing the game settings during setup
    default: op
