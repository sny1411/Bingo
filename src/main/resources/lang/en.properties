# English texts of the plugin, in MiniMessage (https://docs.advntr.dev/minimessage/format.html).
# <arg:0>, <arg:1>... are replaced by the values given by the code (team name, number of minutes...).
# English is used when a text is missing in the player's language.

bingo.team.finished=Team <arg:0> has finished its game
bingo.team.finished.continue=It can keep playing or become spectators
bingo.team.finished.spec=<gray><i>Use the <yellow>/spec</yellow> command to become a spectator

bingo.timer.remaining.minutes=<arg:0> minutes left
bingo.timer.remaining.minute=1 minute left
bingo.timer.remaining.seconds=<arg:0> seconds left
bingo.timer.remaining.second=1 second left
