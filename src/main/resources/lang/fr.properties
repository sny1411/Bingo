# French texts of the plugin, in MiniMessage (https://docs.advntr.dev/minimessage/format.html).
# <arg:0>, <arg:1>... are replaced by the values given by the code (team name, number of minutes...).

bingo.team.finished=L'équipe <arg:0> a fini sa partie
bingo.team.finished.continue=Elle peut continuer de jouer ou devenir spectatrice
bingo.team.finished.spec=<gray><i>Utilisez la commande <yellow>/spec</yellow> pour devenir spectateur

bingo.timer.remaining.minutes=<arg:0> minutes restantes
bingo.timer.remaining.minute=1 minute restante
bingo.timer.remaining.seconds=<arg:0> secondes restantes
bingo.timer.remaining.second=1 seconde restante
